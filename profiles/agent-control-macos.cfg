# Portable agent-control base for Apple Silicon macOS with Metal/MoltenVK.
# Select explicitly with --config; callers supply content and runtime paths.
audio_driver = "coreaudio3"
input_driver = "cocoa"
video_driver = "vulkan"
video_threaded = "false"
video_use_metal_arg_buffers = "true"
video_vsync = "true"
stdin_cmd_enable = "true"
pause_nonactive = "false"
config_save_on_exit = "false"
# App-bundle asset extraction otherwise saves a full config even with the
# exit-time save disabled. Agent sessions do not need desktop menu assets.
bundle_assets_extract_enable = "false"
# Prevent ambient game/core overrides and remaps from changing the session.
auto_overrides_enable = "false"
auto_remaps_enable = "false"
